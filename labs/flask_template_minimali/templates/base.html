<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Template Flask Minimali" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='simple.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('home') }}">Template Flask</a>
      <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('lista_progetti') }}">Lista</a>
        <a href="{{ url_for('nuovo_progetto') }}">Nuovo</a>
      </nav>
    </header>

    <main class="page">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <section class="messages">
            {% for category, message in messages %}
              <p class="message {{ category }}">{{ message }}</p>
            {% endfor %}
          </section>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>

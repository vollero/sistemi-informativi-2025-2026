name: palestra-containerizzata

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: palestra
      POSTGRES_USER: palestra
      POSTGRES_PASSWORD: palestra
    ports:
      - "5433:5432"
    volumes:
      - palestra_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/lab/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palestra -d palestra"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: labs/palestra_containerizzata/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://palestra:palestra@db:5432/palestra
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: 0
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  repl:
    build:
      context: ../..
      dockerfile: labs/palestra_containerizzata/repl/Dockerfile
    environment:
      DATABASE_URL: postgresql://palestra:palestra@db:5432/palestra
    stdin_open: true
    tty: true
    profiles:
      - repl
    depends_on:
      db:
        condition: service_healthy

volumes:
  palestra_pg_data:
